<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PetHouse — Adopt a Friend</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0d1526; 
      --card:#0b1220; 
      --muted:#9aa5b1; 
      --accent:#ff7a59; 
      --glass: rgba(255,255,255,0.06);
      --glass-2: rgba(255,255,255,0.04);
    }

    body{
      margin:0; 
      font-family: 'Poppins', sans-serif; 
      color:#e7eff7;
      background: linear-gradient(180deg,#071021 0%, #0d1526 60%);
    }

    .container{max-width:1100px;margin:0 auto;padding:20px}

    /* ---------- Navbar ---------- */
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 0;
    }

    .brand{display:flex;align-items:center;gap:12px}

    .logo{
      width:48px;height:48px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--accent),#ffb284);
      font-weight:700;font-size:18px;color:#fff;
    }

    nav{display:flex;gap:16px}
    .nav-link{
      color:var(--muted);text-decoration:none;
      padding:8px 14px;border-radius:10px;font-weight:500;
    }
    .nav-link:hover{background:var(--glass);color:#fff}

    .controls{display:flex;gap:10px}
    .btn{
      background:var(--accent);
      border:none;padding:10px 14px;border-radius:12px;
      color:#fff;font-weight:600;cursor:pointer
    }
    .icon-btn{
      background:var(--glass);border:none;
      padding:10px;border-radius:12px;color:var(--muted);
      cursor:pointer
    }
    
    /* ---------- Hero ---------- */
    .hero{
      background:var(--glass);
      padding:30px;border-radius:22px;
      backdrop-filter: blur(10px);
      box-shadow:0 8px 40px rgba(0,0,0,0.45);
      margin-top:15px;
    }

    .hero h1{margin:0;font-size:36px;font-weight:700}
    .hero p{color:var(--muted);margin-top:10px}

    .search-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
    .input, select{
      background:rgba(255,255,255,0.05);
      border:1px solid var(--glass);
      padding:12px 14px;border-radius:12px;color:inherit;
      outline:none;min-width:150px;
    }
    .input::placeholder{color:var(--muted)}

    /* ---------- Grid ---------- */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:22px;margin-top:26px;
    }

    .pet{
      background:var(--glass);
      padding:14px;border-radius:16px;
      transition:0.2s;
      cursor:pointer;
      box-shadow:0 4px 25px rgba(0,0,0,0.3);
    }
    .pet:hover{
      transform:translateY(-8px);
      box-shadow:0 10px 35px rgba(0,0,0,0.5);
    }

    .media{
      height:170px;border-radius:12px;
      overflow:hidden;
      background:var(--glass-2);
      display:flex;align-items:center;justify-content:center;
    }

    .media img{
      width:100%;height:100%;object-fit:cover;
    }

    .pet h4{margin:10px 0 4px}
    .pet p{margin:0;color:var(--muted);font-size:14px}

    .actions{
      display:flex;gap:10px;margin-top:10px;align-items:center
    }

    .fav{margin-left:auto;font-size:20px;background:none;border:none;color:#ff7a7a;cursor:pointer}

    .badge{
      background:rgba(255,255,255,0.05);
      padding:6px 10px;border-radius:10px;
      font-size:12px;color:var(--muted)
    }

    /* ---------- Modal ---------- */
    .modal-backdrop{
      position:fixed;inset:0;
      background:rgba(0,0,0,0.65);
      display:none;
      align-items:center;justify-content:center;
      padding:20px;
      backdrop-filter:blur(4px);
    }

    .modal{
      background:var(--glass);
      border-radius:18px;padding:22px;
      max-width:760px;width:100%;
      display:grid;grid-template-columns:280px 1fr;gap:18px;
      box-shadow:0 10px 45px rgba(0,0,0,0.6);
    }

    .modal .media{height:240px}
    .close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}

    /* ---------- Form ---------- */
    .adopt-form{display:flex;flex-direction:column;gap:12px}
    .adopt-form textarea{min-height:100px;border-radius:14px}

    .toast{
      position:fixed;right:20px;bottom:20px;
      background:var(--card);padding:12px 18px;
      border-radius:14px;border-left:5px solid var(--accent);
      display:none;
    }

    @media (max-width:900px){
      .modal{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
<div class="container">

  <!-- NAVBAR -->
  <header>
    <div class="brand">
      <div class="logo">PH</div>
      <div>
        <div style="font-weight:700">PetHouse</div>
        <div style="font-size:12px;color:var(--muted)">Find your furry friend</div>
      </div>
    </div>

    <nav>
      <a class="nav-link" href="#">Home</a>
      <a class="nav-link" href="#pets-grid">Pets</a>
      <a class="nav-link" href="#form">Adopt</a>
    </nav>

    <div class="controls">
      <button id="uploadBtn" class="icon-btn">➕</button>
      <button id="themeToggle" class="icon-btn">🌙</button>
      <button id="viewFav" class="btn">Favorites (<span id="favCount">0</span>)</button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Find a Pet. Give a Home.</h1>
    <p>Search pets, open details, save favorites & adopt easily.</p>

    <div class="search-row">
      <input id="search" class="input" placeholder="Search pets..." />
      <select id="typeFilter" class="input">
        <option value="all">All Types</option>
        <option value="dog">Dog</option>
        <option value="cat">Cat</option>
        <option value="rabbit">Rabbit</option>
      </select>

      <select id="ageFilter" class="input">
        <option value="all">All Ages</option>
        <option value="1">1 Year</option>
        <option value="2">2 Years</option>
        <option value="3">3+ Years</option>
      </select>

      <button id="apply" class="btn">Apply</button>
    </div>
  </section>

  <!-- PET GRID -->
  <section id="pets-grid">
    <div class="grid" id="grid"></div>
  </section>

  <!-- ADOPTION FORM -->
  <section id="form" style="margin-top:32px">
    <div class="hero">
      <h2>Adoption Form</h2>

      <form id="adoptForm" class="adopt-form">
        <input id="yourName" class="input" placeholder="Your name*" required />
        <input id="yourEmail" class="input" placeholder="Email*" type="email" required />
        <input id="selectedPet" class="input" placeholder="Pet Name*" required />
        <textarea id="why" class="input" placeholder="Why do you want to adopt?*" required></textarea>

        <div style="display:flex;gap:12px">
          <button type="submit" class="btn">Submit Request</button>
          <button type="button" id="clearLocal" class="icon-btn">Clear Data</button>
        </div>
      </form>
    </div>
  </section>

</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="media" id="modalMedia"></div>

    <div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <h3 id="modalName"></h3>
          <div id="modalBreed" style="color:var(--muted)"></div>
        </div>
        <div>
          <button class="close" id="modalFav">♡</button>
          <button class="close" id="modalClose">✕</button>
        </div>
      </div>

      <p id="modalDesc" style="margin-top:12px;color:var(--muted)"></p>

      <div style="display:flex;gap:8px;margin-top:12px">
        <div class="badge" id="modalAge"></div>
        <div class="badge" id="modalType"></div>
      </div>

      <button id="adoptNow" class="btn" style="margin-top:16px">Adopt This Pet</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">Message</div>

<!-- JS -->
<script>
/* ======================================================
   SAME FULL FUNCTIONAL JS — WORKS WITHOUT VIDEO OR BIRD
   ====================================================== */
function genId(){ return 'p_'+Math.random().toString(36).slice(2,9); }

const initialPets = [
  {
    id: genId(), name:'Rocky', type:'dog', age:1, breed:'Mixed',
    img:'https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800&q=80',
    desc:'Energetic and friendly, good with kids.'
  },
  {
    id: genId(), name:'Mittens', type:'cat', age:2, breed:'Tabby',
    img:'https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=800&q=80',
    desc:'Calm lap cat who enjoys sunbeams.'
  },
  {
    id: genId(), name:'Snowy', type:'rabbit', age:3, breed:'Angora',
    img:'https://images.unsplash.com/photo-1619983081607-d8e859b0a0c3?w=800&q=80',
    desc:'Soft and gentle, needs a calm home.'
  },
];

const PETS_KEY = "pethouse_pets_v1";
const FAVS_KEY = "pethouse_favs_v1";

const grid = document.getElementById("grid");
const toast = document.getElementById("toast");
const favCount = document.getElementById("favCount");

function showToast(msg, t=2000){
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(()=>toast.style.display='none', t);
}

function loadPets(){
  let raw = localStorage.getItem(PETS_KEY);
  if(!raw){ localStorage.setItem(PETS_KEY, JSON.stringify(initialPets)); return initialPets; }
  return JSON.parse(raw);
}
function savePets(p){ localStorage.setItem(PETS_KEY, JSON.stringify(p)); }

function loadFavs(){ return JSON.parse(localStorage.getItem(FAVS_KEY) || '[]'); }
function saveFavs(f){ localStorage.setItem(FAVS_KEY, JSON.stringify(f)); updateFavCount(); }
function updateFavCount(){ favCount.textContent = loadFavs().length; }

function renderGrid(pets){
  grid.innerHTML = "";
  pets.forEach(p=>{
    const el = document.createElement("div");
    el.className="pet";

    el.innerHTML = `
      <div class="media"><img src="${p.img}"></div>
      <h4>${p.name}</h4>
      <p>${p.breed} • Age ${p.age}</p>
      <div class="actions">
        <button class="btn view">View</button>
        <button class="fav">${loadFavs().includes(p.id) ? '❤️' : '♡'}</button>
      </div>
    `;

    el.querySelector(".view").onclick = ()=>openModal(p.id);
    el.querySelector(".fav").onclick = ()=>toggleFav(p.id, el.querySelector(".fav"));

    grid.appendChild(el);
  });
}

/* ------- Modal -------- */
const modal = document.getElementById("modal");
const modalMedia = document.getElementById("modalMedia");
const modalName = document.getElementById("modalName");
const modalBreed = document.getElementById("modalBreed");
const modalDesc = document.getElementById("modalDesc");
const modalAge = document.getElementById("modalAge");
const modalType = document.getElementById("modalType");
const modalFav = document.getElementById("modalFav");
const modalClose = document.getElementById("modalClose");
const adoptNow = document.getElementById("adoptNow");

let currentPetId = null;

function openModal(id){
  currentPetId = id;
  const pet = loadPets().find(x=>x.id===id);
  modalMedia.innerHTML = `<img src="${pet.img}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`;
  modalName.textContent = pet.name;
  modalBreed.textContent = pet.breed;
  modalDesc.textContent = pet.desc;
  modalAge.textContent = "Age: " + pet.age;
  modalType.textContent = "Type: " + pet.type;
  modalFav.textContent = loadFavs().includes(id) ? "❤️" : "♡";
  modal.style.display="flex";
}

modalClose.onclick = ()=>modal.style.display="none";
modal.onclick = e=>{ if(e.target===modal) modal.style.display="none"; };

modalFav.onclick = ()=>{
  toggleFav(currentPetId, modalFav);
  modalFav.textContent = loadFavs().includes(currentPetId) ? "❤️" : "♡";
};

adoptNow.onclick = ()=>{
  document.getElementById("selectedPet").value = modalName.textContent;
  modal.style.display="none";
  window.scrollTo({top:document.getElementById("form").offsetTop, behavior:"smooth"});
};

/* ------- Favorites ------- */
function toggleFav(id, btn){
  let favs = loadFavs();
  if(favs.includes(id)){
    favs = favs.filter(x=>x!==id);
    if(btn) btn.textContent = "♡";
    showToast("Removed from favorites");
  }else{
    favs.push(id);
    if(btn) btn.textContent = "❤️";
    showToast("Saved to favorites");
  }
  saveFavs(favs);
}

document.getElementById("viewFav").onclick = ()=>{
  const favs = loadFavs();
  if(favs.length===0) return showToast("No favorites yet");
  const pets = loadPets().filter(p=>favs.includes(p.id));
  renderGrid(pets);
};

/* ------- Filters ------- */
const search = document.getElementById("search");
const typeFilter = document.getElementById("typeFilter");
const ageFilter = document.getElementById("ageFilter");

function applyFilters(){
  const q = search.value.toLowerCase();
  const type = typeFilter.value;
  const age = ageFilter.value;

  let pets = loadPets();

  pets = pets.filter(p=>{
    if(type!=='all' && p.type!==type) return false;
    if(age!=='all'){
      if(age=='3' && p.age<3) return false;
      if(age!='3' && p.age!=parseInt(age)) return false;
    }
    if(q && !(p.name+" "+p.breed+" "+p.desc).toLowerCase().includes(q)) return false;
    return true;
  });

  renderGrid(pets);
}

document.getElementById("apply").onclick = applyFilters;
search.oninput = ()=>setTimeout(applyFilters, 200);

/* ------- Adoption Form ------- */
document.getElementById("adoptForm").onsubmit = e=>{
  e.preventDefault();
  showToast("Adoption request submitted!");
  e.target.reset();
};

/* ------- Add Pet ------- */
const fileInput = document.createElement("input");
fileInput.type="file"; fileInput.accept="image/*";

document.getElementById("uploadBtn").onclick = ()=>fileInput.click();

fileInput.onchange = ()=>{ 
  const f = fileInput.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const pets = loadPets();
    pets.unshift({
      id:genId(),
      name:f.name.split(".")[0],
      type:"dog", age:1, breed:"Unknown",
      img:e.target.result,
      desc:"User uploaded pet."
    });
    savePets(pets);
    renderGrid(pets);
    showToast("Pet added!");
  };
  reader.readAsDataURL(f);
};

/* ------- Theme Toggle ------- */
document.getElementById("themeToggle").onclick = ()=>{
  document.body.classList.toggle("light");
};

/* ------- Clear Local Data ------- */
document.getElementById("clearLocal").onclick=()=>{
  localStorage.clear();
  showToast("Data cleared! Reloading...");
  setTimeout(()=>location.reload(),900);
};

/* ------- Init ------- */
renderGrid(loadPets());
updateFavCount();
</script>

</body>
</html>
